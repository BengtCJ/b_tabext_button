<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Back Nav Button</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    #back-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #ffffff;
      border: none;
      border-radius: 10px;
      width: min(90px, 90vw, 90vh);
      height: min(90px, 90vw, 90vh);
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      transition: opacity 0.15s ease;
    }

    #back-btn:hover  { opacity: 0.85; }
    #back-btn:active { opacity: 0.65; }
    #back-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .icon-circle {
      width: 32px;
      height: 32px;
      background: #1a1a1a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-circle svg {
      width: 16px;
      height: 16px;
    }

    .btn-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #1a1a1a;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <button id="back-btn" disabled title="Loading...">
    <div class="icon-circle">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="4" y1="4" x2="12" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <line x1="12" y1="4" x2="4" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="btn-label">Close</span>
  </button>

  <script src="https://extensions.cdn.tableau.com/tableau.extensions.1.latest.js"></script>
  <script defer src="extension.js"></script>
</body>
</html>
