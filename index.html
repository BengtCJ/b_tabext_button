<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Back Nav Button</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    #back-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 10px 12px;
      background: #ffffff;
      border: none;
      border-radius: 10px;
      width: min(95px, 95vw, 95vh);
      height: min(95px, 95vw, 95vh);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
      transition: opacity 0.15s ease;
    }

    #back-btn:hover  { opacity: 0.85; }
    #back-btn:active { opacity: 0.65; }
    #back-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .arrow {
      font-size: 18px;
      color: #1a1a1a;
      line-height: 1;
      margin-bottom: 4px;
    }

    .btn-label {
      font-size: 11px;
      font-weight: 400;
      color: #1a1a1a;
      letter-spacing: 0;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <button id="back-btn" disabled title="Loading...">
    <span class="arrow">&#9664;</span>
    <span class="btn-label">Back</span>
  </button>

  <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
  <script src="extension.js"></script>
</body>
</html>
