<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Back Nav Button</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      overflow: hidden;
    }

    body {
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    #back-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: transparent;
      border: none;
      border-radius: 10px;
      width: min(88px, 88vw, 88vh);
      height: min(88px, 88vw, 88vh);
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      transition: opacity 0.15s ease;
    }

    #back-btn:hover {
      opacity: 0.85;
    }

    #back-btn:active {
      opacity: 0.65;
    }

    #back-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .icon-circle {
      width: 32px;
      height: 32px;
      background: #1a1a1a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-circle svg {
      width: 16px;
      height: 16px;
    }

    .btn-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #1a1a1a;
      text-transform: uppercase;
    }

    #status {
      display: none;
    }
  </style>
</head>
<body>

  <button id="back-btn" disabled title="Loading...">
    <div class="icon-circle">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="13" y1="8" x2="3" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <polyline points="7,4 3,8 7,12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="btn-label">Back</span>
  </button>

  <span id="status"></span>

  <script src="https://extensions.cdn.tableau.com/tableau.extensions.1.latest.js"></script>
  <script src="extension.js"></script>
</body>
</html>
